[project]
name = "trading-research-agent"
version = "0.1.0"
description = "An open-source deep research agent for US equities: cited, verifiable research reports from SEC filings, market data and the web."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jason" }]
keywords = ["llm", "agent", "langgraph", "research", "sec-edgar", "finance"]

dependencies = [
    "openai>=1.60",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "rich>=13.9",
    "yfinance>=1.6",
    "edgartools>=5.53",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
]

[project.urls]
Homepage = "https://github.com/ihaichao/trading-research-agent"
Issues = "https://github.com/ihaichao/trading-research-agent/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tra"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001/002/003: 中文注释里的全角标点会被判为"歧义字符"，本项目注释以中文为主，关掉
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: tests that hit real external APIs (deselect with -m 'not network')",
]
